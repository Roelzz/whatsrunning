[project]
name = "whatsrunning"
version = "0.1.0"
description = "Visual insight into Docker containers, networks, server ports, and Nginx Proxy Manager mappings"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "loguru>=0.7.3",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "reflex>=0.8.26",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
