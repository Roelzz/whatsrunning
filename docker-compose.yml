services:
  app:
    build: .
    container_name: whatsrunning-app
    ports:
      - "2009:3000"
      - "8001:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - npm_data:/data:ro
    networks:
      - whatsrunning_network
    restart: unless-stopped

networks:
  whatsrunning_network:
    driver: bridge

volumes:
  npm_data:
    external: true
    # Note: Adjust this to point to your NPM volume
    # Example: name: nginxproxymanager_data
